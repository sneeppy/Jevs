# Подхватывается после: docker compose up -d --force-recreate
# Порт сервера задаётся переменной PORT в .env.

model: Cloudflare/clef-flash

# Окно промпта в токенах. Маршрут SGLang всё равно обрезает запрос на 16384.
# На RTX 4500 (24 или 32 ГБ) длинное окно не помещается: веса bf16 около 18 ГБ,
# а оценка Cloudflare для окна 64k — от 41 ГБ видеопамяти на один запрос.
context_length: 8192

# Один запрос на карту, чтобы второй prefill не забрал остаток памяти.
max_running_requests: 1

# Доля памяти карты под веса и KV. Пусто — SGLang считает сам.
# Если старт падает с нехваткой памяти, снизьте значение, например до 0.80.
mem_fraction_static: 0.90
