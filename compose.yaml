name: jevs

services:
  clef:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jevs-clef
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      CLEF_CONFIG: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - hf-cache:/cache/huggingface
    ports:
      - "${PORT}:${PORT}"
    ipc: host
    shm_size: 32gb
    init: true
    restart: unless-stopped
    gpus: all
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  hf-cache:
