name: jevs

services:
  clef:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: jevs-clef
    env_file: .env
    environment:
      HF_HOME: /cache/huggingface
      HF_HUB_CACHE: /cache/huggingface/hub
      HUGGINGFACE_HUB_CACHE: /cache/huggingface/hub
      CLEF_CONFIG: /config/config.yaml
    volumes:
      - ./config.yaml:/config/config.yaml:ro
      - hf-cache:/cache/huggingface
    ports:
      - "${PORT}:${PORT}"
    ipc: host
    shm_size: 32gb
    init: true
    restart: unless-stopped
    gpus: all
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - import os,urllib.request; port=os.environ['PORT']; req=urllib.request.Request('http://127.0.0.1:%s/health'%port); key=os.environ.get('CLEF_API_KEY',''); req.add_header('Authorization','Bearer '+key) if key else None; urllib.request.urlopen(req, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  hf-cache:
